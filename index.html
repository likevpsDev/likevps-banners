<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Карусель баннеров LikeVPS</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Rubik', sans-serif; }

    .carousel {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
      max-height: 180px;
    }

    .slides {
      display: flex;
      transition: transform 0.6s ease-in-out;
    }

    .slide {
      flex: 0 0 100%;
      text-align: center;
      padding: 8px;
    }

    .banner-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background-image: url('./image1.png');
      background-size: cover;
      background-position: center;
      height: 164px; /* 180px - 2*8px padding */
      padding: 20px;
      color: white;
      text-shadow: 0 0 4px rgba(0,0,0,0.6);
      border-radius: 10px;
    }

    .banner-content {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      padding-right: 160px; /* Место для кнопки */
    }

    .banner-left {
      flex: 1;
      min-width: 0;
      text-align: left;
      font-size: 20px;
      font-weight: bold;
      padding-right: 20px;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .banner-image {
      flex-shrink: 0;
      width: 124px; /* 280px не помещалось */
      height: 124px;
      object-fit: contain;
      margin-right: 20px;
    }

    .subscribe-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: inline-block;
      padding: 10px 20px;
      background-color: #2199abfa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .subscribe-btn:hover {
      background-color: #2199ab95;
    }

    .pagination {
      position: absolute;
      bottom: 12px;
      width: 100%;
      text-align: center;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin: 0 4px;
      background-color: #bbb;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .dot.active {
      background-color: #717171;
    }

    @media (max-width: 768px) {
      .banner-wrapper {
        height: 140px;
        padding: 15px;
      }
      
      .banner-left {
        font-size: 16px;
        padding-right: 15px;
      }

      .banner-image {
        width: 80px;
        height: 80px;
        margin-right: 15px;
      }
      
      .banner-content {
        padding-right: 130px;
      }
      
      .subscribe-btn {
        padding: 8px 16px;
        font-size: 14px;
        bottom: 15px;
        right: 15px;
      }
    }

    @media (max-width: 480px) {
      .banner-wrapper {
        height: 120px;
        padding: 10px;
      }
      
      .banner-left {
        font-size: 14px;
        padding-right: 10px;
      }

      .banner-image {
        width: 60px;
        height: 60px;
        margin-right: 10px;
      }
      
      .banner-content {
        padding-right: 110px;
      }
      
      .subscribe-btn {
        padding: 6px 12px;
        font-size: 12px;
        bottom: 10px;
        right: 10px;
      }
    }
  </style>
</head>
<body>

<div class="carousel" id="carousel">
  <div class="slides" id="slides">
    
    <!-- Баннер 1 -->
    <div class="slide" id="banner1">
      <div class="banner-wrapper">
        <div class="banner-content">
          <div class="banner-left">Будьте в курсе новостей и скидок — подпишитесь на наш Telegram-канал</div>
          <img class="banner-image" src="./картинка.png" alt="Дополнительная картинка" />
        </div>
        <a class="subscribe-btn" href="http://t.me/likevps" target="_blank">Подписаться</a>
      </div>
    </div>

    <!-- Баннер 2 -->
    <div class="slide" id="banner2">
      <a href="https://likevps.net/vps" target="_blank">
        <img src="./image2.png" alt="Баннер 2" style="max-height: 164px; width: auto; margin: 0 auto; display: block;" />
      </a>
    </div>

  </div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
  const slidesContainer = document.getElementById('slides');
  const pagination = document.getElementById('pagination');
  const banner2 = document.querySelector('#banner2 img');
  let index = 0;
  let interval;

  banner2.addEventListener('error', () => {
    document.getElementById('banner2')?.remove();
    initCarousel();
  });

  if (banner2.complete) {
    if (!banner2.naturalWidth) {
      document.getElementById('banner2')?.remove();
    }
    initCarousel();
  } else {
    banner2.addEventListener('load', initCarousel);
  }

  function updateSlidePosition() {
    slidesContainer.style.transform = `translateX(-${index * 100}%)`;
    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === index);
    });
  }

  function createPagination(totalSlides) {
    pagination.innerHTML = '';
    if (totalSlides <= 1) {
      pagination.style.display = 'none';
      return;
    }
    pagination.style.display = 'block';

    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('span');
      dot.classList.add('dot');
      if (i === 0) dot.classList.add('active');
      dot.addEventListener('click', () => {
        index = i;
        updateSlidePosition();
      });
      pagination.appendChild(dot);
    }
  }

  function startCarousel(totalSlides) {
    if (interval) clearInterval(interval);
    if (totalSlides <= 1) return;

    interval = setInterval(() => {
      index = (index + 1) % totalSlides;
      updateSlidePosition();
    }, 5000);
  }

  function initCarousel() {
    const totalSlides = slidesContainer.children.length;
    index = 0;
    createPagination(totalSlides);
    updateSlidePosition();
    startCarousel(totalSlides);
  }

  initCarousel();
</script>

</body>
</html>
